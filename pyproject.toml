[project]
name = "gqlsleuth"
version = "0.1.0"
description = "A CLI for authorized GraphQL security discovery and analysis"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomás Ortiz" }]
keywords = ["graphql", "security", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "graphql-core>=3.2.12",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "websockets>=17.1",
]

[project.scripts]
gqlsleuth = "gqlsleuth.cli:main"

[project.urls]
Homepage = "https://github.com/Tomas-Ortiz/gqlsleuth"
Source = "https://github.com/Tomas-Ortiz/gqlsleuth"
Issues = "https://github.com/Tomas-Ortiz/gqlsleuth/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md", "docs/RELEASING.md", "scripts/*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=gqlsleuth",
    "--cov-report=term-missing",
]
